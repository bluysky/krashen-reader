name: Rename space-2 to index
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/rename-to-index.yml'
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename file
        run: |
          mv space-2.html index.html
          git config user.name "bluysky"
          git config user.email "bluysky@users.noreply.github.com"
          git add -A
          git commit -m "Rename space-2.html to index.html"
          git push
